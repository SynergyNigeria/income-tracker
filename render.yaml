services:
  - type: web
    name: my-income-tracker
    runtime: python
    buildCommand: ./build.sh
    startCommand: python3 manage.py migrate && python3 -m gunicorn incometracker.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_PATH
        value: /data/db.sqlite3
